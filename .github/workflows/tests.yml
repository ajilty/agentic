name: tests
# Every job runs a section of scripts/check.sh, the same script contributors run
# locally (and the pre-push hook runs). Change checks there, not here.
on: [push, pull_request]
jobs:
  plugin-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yq (v4, mikefarah)
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Install rumdl (guards markdown-lint tests skip without it)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false   # no lockfile in this repo; the cache would never invalidate
      - run: uv tool install rumdl && rumdl --version
      - name: Run every plugin suite (plugins/*/tests/run.sh)
        run: bash scripts/check.sh plugin-tests
  validate-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and all plugins (strict)
        run: bash scripts/check.sh validate-plugins
  review-workflow-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yq (v4, mikefarah)
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Review job can post (pull-requests write) and skips fork PRs
        # Assertions live in scripts/check.sh (review_workflow_guards) so local runs match.
        run: bash scripts/check.sh review-workflow-guards

  library-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Symlinks resolve, no file symlinks (library-view wiring, ADR-0036)
        run: bash scripts/check.sh library-wiring
